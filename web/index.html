<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WIMS — Warehouse & Inventory Management</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="login" class="login-screen">
    <form id="login-form" class="login-card" novalidate>
      <div class="logo logo-lg">W</div>
      <h1>WIMS Admin</h1>
      <p class="muted login-sub">Sign in to manage your warehouses</p>

      <label class="field">
        <span>Username</span>
        <input id="login-user" type="text" value="admin" autocomplete="username" required />
      </label>
      <label class="field">
        <span>Password</span>
        <input id="login-pass" type="password" value="admin123" autocomplete="current-password" required />
      </label>

      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <p id="login-error" class="login-error"></p>
      <p class="login-hint">Default credentials — <b>admin</b> / <b>admin123</b></p>
    </form>
  </div>

  <!-- ===================== APP ===================== -->
  <div class="app" id="app" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">W</div>
        <div class="brand-text">
          <div class="brand-name">WIMS</div>
          <div class="brand-sub">Inventory System</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="inventory">
          <svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5V16l9 4.5 9-4.5V7.5"/><path d="M12 12v8.5"/></svg>
          <span>Inventory</span>
        </button>
        <button class="nav-item" data-view="orders">
          <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.6" cy="6" r="1.2"/><circle cx="3.6" cy="12" r="1.2"/><circle cx="3.6" cy="18" r="1.2"/></svg>
          <span>Orders</span>
        </button>
        <button class="nav-item" data-view="warehouses">
          <svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-6h10v6"/><path d="M7 11h10"/></svg>
          <span>Warehouses</span>
        </button>
        <button class="nav-item" data-view="customers">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><path d="M16 5.6a3 3 0 0 1 0 5.8"/><path d="M17.2 15c2.2.5 3.6 2 3.6 4.2"/></svg>
          <span>Customers</span>
        </button>
        <button class="nav-item" data-view="suppliers">
          <svg viewBox="0 0 24 24"><path d="M3 6h11v9H3z"/><path d="M14 9h3.6l3.4 3.4V15h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17.6" cy="18" r="1.8"/></svg>
          <span>Suppliers</span>
        </button>
        <button class="nav-item" data-view="audit">
          <svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12L16 12h5"/></svg>
          <span>Audit Log</span>
        </button>
      </nav>

    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">Dashboard</h1>
          <p id="view-sub" class="muted">Overview of warehouse activity</p>
        </div>
        <div class="topbar-actions">
          <div class="wh-picker">
            <span class="wh-label">Warehouse</span>
            <select id="wh-select" title="Switch active warehouse"></select>
          </div>
          <button id="theme-btn" class="icon-btn theme-btn" title="Toggle dark / light mode" aria-label="Toggle theme">
            <svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></svg>
            <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <span id="status" class="status"><i></i><span id="status-text">Connecting…</span></span>
          <button id="save-btn" class="btn btn-primary" data-action="save">Save</button>
          <button id="logout-btn" class="btn btn-ghost" data-action="logout">Logout</button>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>
